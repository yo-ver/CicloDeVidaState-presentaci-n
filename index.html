<style>

    --amber: #e6bd63;
    --amber-soft: #3a2f14;
    --bg: #0f151c;
    --surface: #161f29;
    --surface-2: #1d2833;
    --ink: #e8edf2;

  body {

    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", system-ui, sans-serif;

  }

  .shell { max-width: 1180px; margin: 0 auto; padding-block: 20px 48px; }

  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 24px;
    justify-content: space-between;
    padding-block: 6px 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .eyebrow {
    font-size: 12px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--cyan); font-weight: 600;
  }
  .brand h1 { font-size: clamp(22px, 3vw, 30px); margin: 0; color: var(--navy-deep); font-weight: 800; }
  .brand p { margin: 2px 0 0; color: var(--ink-soft); font-size: 14px; }

    display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 2px;
    border: 1px solid var(--line);
  }
  .mode-toggle button {
    border: none; background: transparent; padding: 9px 18px; border-radius: 999px;
    font-family: "Manrope", sans-serif; font-weight: 700; font-size: 13.5px; color: var(--ink-soft);

  }
  .mode-toggle button.active { background: var(--navy); color: #fff; }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- DIAGRAM VIEW ---------- */
  .diagram-layout {
    display: grid;
    grid-template-columns: minmax(240px, 340px) 1fr;
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 780px) {
    .diagram-layout { grid-template-columns: 1fr; }
  }

  .rail-wrap {
    position: sticky;
    top: 12px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  @media (max-width: 780px) { .rail-wrap { position: static; } }

  .mounted-strip {
    display: flex; align-items: center; gap: 10px;

    padding: 10px 14px; margin-bottom: 14px; font-size: 13px; color: var(--ink-soft);
  }

  .mounted-dot.on { background: var(--repeat); box-shadow: 0 0 0 4px var(--repeat-soft); }
  .mounted-strip b { color: var(--ink); font-family: "JetBrains Mono", monospace; font-size: 13px; }

  .rail { list-style: none; margin: 0; padding: 0; position: relative; }
  .rail::before {
    content: ""; position: absolute; left: 17px; top: 8px; bottom: 8px; width: 2px;
    background: var(--line);
  }
  .rail li { position: relative; }
  .rail button.node {
    all: unset;
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 9px 10px 9px 0; cursor: pointer; border-radius: 10px;
  }
  .rail button.node:hover { background: var(--surface-2); }
  .rail button.node:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .node-dot {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: var(--surface); border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: "Manrope", sans-serif; font-weight: 800; font-size: 13px; color: var(--ink-soft);
    position: relative; z-index: 1; transition: all .15s;
  }
  .node-label { font-size: 14.5px; font-weight: 600; color: var(--ink); font-family: "JetBrains Mono", monospace; }
  .node-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; }
  .rail button.node.selected .node-dot {
    background: var(--navy); border-color: var(--navy); color: #fff;
  }
  .rail button.node.selected .node-label { color: var(--navy-deep); }

  .branch-note {
    margin: 2px 0 2px 48px; font-size: 12px; color: var(--cond); background: var(--cond-soft);

  }
  .loop-note {
    margin: 2px 0 10px 48px; font-size: 12px; color: var(--repeat); background: var(--repeat-soft);

  .panel p { line-height: 1.6; font-size: 15.5px; margin: 0 0 14px; }

  .panel-nav button:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
  .panel-nav button:disabled { opacity: .4; cursor: default; background: var(--surface-2); color: var(--ink); border-color: var(--line); }

  /* ---------- QUIZ VIEW ---------- */
  .quiz-wrap { max-width: 720px; margin: 0 auto; }
  .quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .quiz-progress { font-size: 13px; color: var(--ink-soft); font-family: "JetBrains Mono", monospace; }
  .quiz-shuffle {
    font-family: "Manrope", sans-serif; font-weight: 700; font-size: 13px; color: var(--navy);

  }
  .quiz-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 26px 28px; }
  @media (max-width: 480px) { .quiz-card { padding: 20px 18px; } }
  .quiz-q { font-size: 18px; font-weight: 700; font-family: "Manrope", sans-serif; margin: 0 0 18px; color: var(--ink); line-height: 1.4; }
  .quiz-opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
  .quiz-opt {
    text-align: left; border: 1.5px solid var(--line); background: var(--surface-2);
    border-radius: 11px; padding: 12px 14px; font-size: 14.5px; cursor: pointer; color: var(--ink);
    font-family: "Source Sans 3", sans-serif;
  }
  .quiz-opt:hover { border-color: var(--navy); }
  .quiz-opt.correct { background: var(--repeat-soft); border-color: var(--repeat); font-weight: 600; }
  .quiz-opt.wrong { background: var(--cond-soft); border-color: var(--cond); }
  .quiz-opt:disabled { cursor: default; }
  .quiz-explain {
    margin-top: 16px; background: var(--surface-2); border-radius: 12px; padding: 14px 16px;
    font-size: 14px; line-height: 1.55; color: var(--ink-soft); display: none;
  }
  .quiz-explain.show { display: block; }
  .quiz-explain b { color: var(--ink); }
  .quiz-nav { display: flex; justify-content: space-between; margin-top: 20px; }
  .quiz-nav button {
    font-family: "Manrope", sans-serif; font-weight: 700; font-size: 14px;
    background: var(--navy); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer;
  }
  .quiz-nav button:disabled { opacity: .35; cursor: default; }
  .quiz-done { text-align: center; padding: 40px 20px; }
  .quiz-done .score { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 44px; color: var(--navy-deep); }
</style>

  ];

  var branchNotes = {
    build: "setState() vuelve aquí directamente, sin pasar por initState()",
    didUpdateWidget: "se activa solo si el padre reconstruye con una NUEVA instancia del MISMO tipo, en la MISMA posición"
  };

  var rail = document.getElementById("rail");
  var panel = document.getElementById("panel");
  var mountedDot = document.getElementById("mountedDot");
  var mountedVal = document.getElementById("mountedVal");
  var current = 0;

  function mountedStateFor(idx) {
    // becomes true at "mounted-true" node, false again at "destroyed"
    var id = nodes[idx].id;
    if (id === "constructor" || id === "createState") return false;
    if (id === "destroyed") return false;
    return true;
  }

  function renderRail() {
    rail.innerHTML = "";
    nodes.forEach(function (n, i) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.className = "node" + (i === current ? " selected" : "");
      btn.setAttribute("data-idx", i);
      btn.innerHTML =
        '<span class="node-dot">' + n.short + '</span>' +
        '<span><span class="node-label">' + n.label + '</span>' +
        '<div class="node-sub">' + n.sub + '</div></span>';
      btn.addEventListener("click", function () { select(i); });
      li.appendChild(btn);
      rail.appendChild(li);

      if (n.id === "build") {
        var loop = document.createElement("div");
        loop.className = "loop-note";
        loop.textContent = "↻ " + branchNotes.build;
        rail.appendChild(loop);
      }
      if (n.id === "didUpdateWidget") {
        var cond = document.createElement("div");
        cond.className = "branch-note";
        cond.textContent = "⤷ " + branchNotes.didUpdateWidget;
        rail.appendChild(cond);
      }
    });
  }

  function renderPanel() {
    var n = nodes[current];
    var html = '<div class="panel-head"><h2>' + n.title + '</h2>';
    if (n.badge) {
      html += '<span class="badge ' + n.badge.type + '">' + n.badge.text + '</span>';
    }
    html += '</div>';
    html += '<p class="panel-intro">' + n.intro + '</p>';
    n.body.forEach(function (p) { html += '<p>' + p + '</p>'; });
    if (n.list) {
      html += '<ul>' + n.list.map(function (l) { return '<li>' + l + '</li>'; }).join("") + '</ul>';
    }
    if (n.code) {
      html += '<pre class="code">' + n.code + '</pre>';
    }
    if (n.warning) {
      html += '<div class="callout warn"><strong>Advertencia — </strong>' + n.warning + '</div>';
    }
    if (n.rule) {
      html += '<div class="callout rule"><strong>Regla de oro — </strong>' + n.rule + '</div>';
    }
    html += '<div class="panel-nav">' +
      '<button id="prevBtn"' + (current === 0 ? " disabled" : "") + '>← Anterior</button>' +
      '<button id="nextBtn"' + (current === nodes.length - 1 ? " disabled" : "") + '>Siguiente →</button>' +
      '</div>';
    panel.innerHTML = html;

    var prevBtn = document.getElementById("prevBtn");
    var nextBtn = document.getElementById("nextBtn");
    if (prevBtn) prevBtn.addEventListener("click", function () { select(current - 1); });
    if (nextBtn) nextBtn.addEventListener("click", function () { select(current + 1); });

    var on = mountedStateFor(current);
    mountedVal.textContent = on ? "true" : "false";
    mountedDot.className = "mounted-dot" + (on ? " on" : "");
  }

  function select(i) {
    if (i < 0 || i >= nodes.length) return;
    current = i;
    renderRail();
    renderPanel();
    panel.scrollTop = 0;
  }

  renderRail();
  renderPanel();

  // ---------------- QUIZ ----------------
  var quizBank = [
    {
      q: "¿Qué método se ejecuta exactamente una sola vez, al crear el objeto State?",
      options: ["build()", "didUpdateWidget()", "initState()", "setState()"],
      correct: 2,
      explain: "<b>initState()</b> se ejecuta una sola vez, inmediatamente después de que el State queda vinculado al BuildContext (mounted = true)."
    },
    {
      q: "¿Cuál es el lugar correcto para acceder de forma segura a Theme.of(context) por primera vez?",
      options: ["initState()", "el constructor del StatefulWidget", "didChangeDependencies() o build()", "dispose()"],
      correct: 2,
      explain: "Dentro de <b>initState()</b> el widget aún no está completamente conectado al árbol; hay que esperar a <b>didChangeDependencies()</b> o a <b>build()</b>."
    },
    {
      q: "¿Qué ocurre si se llama a setState() después de que se ejecutó dispose()?",
      options: ["Flutter lo ignora silenciosamente", "Se lanza una excepción en tiempo de ejecución", "Se vuelve a ejecutar initState()", "El widget se reconstruye normalmente"],
      correct: 1,
      explain: "Tras <b>dispose()</b>, mounted queda en false para siempre; llamar a setState() en ese punto lanza una excepción."
    },
    {
      q: "¿Cuándo se invoca didUpdateWidget()?",
      options: [
        "Cada vez que se llama a setState()",
        "Solo al destruir el widget",
        "Cuando el padre reconstruye este widget con una nueva instancia del mismo tipo, en la misma posición del árbol",
        "Nunca; es un método heredado sin uso"
      ],
      correct: 2,
      explain: "Flutter reutiliza el objeto State existente y llama a <b>didUpdateWidget(oldWidget)</b> para avisar que la configuración cambió."
    },
    {
      q: "¿Qué debe hacerse siempre en dispose() cuando el State usó un TextEditingController?",
      options: ["Nada, se libera automáticamente", "Llamar a controlador.dispose() antes de super.dispose()", "Reasignarlo a null", "Llamarlo dentro de build()"],
      correct: 1,
      explain: "Hay que liberar el controlador explícitamente y luego llamar a <b>super.dispose()</b> al final, en ese orden."
    },
    {
      q: "¿Qué representa la propiedad mounted?",
      options: ["Si el widget tiene hijos", "Si el objeto State está actualmente asociado a un BuildContext activo en el árbol", "Si el widget es Stateless o Stateful", "Si el build() ya se ejecutó una vez"],
      correct: 1,
      explain: "<b>mounted</b> indica si el State sigue conectado al árbol; pasa a true tras createState() y a false definitivo tras dispose()."
    },
    {
      q: "Durante un hot reload exitoso, ¿se vuelve a ejecutar initState()?",
      options: ["Sí, siempre", "No, el estado existente se preserva (a diferencia de un hot restart)", "Solo si el widget es StatelessWidget", "Depende del sistema operativo"],
      correct: 1,
      explain: "El hot reload preserva el objeto State existente. Solo un <b>hot restart</b> destruye y recrea el árbol, ejecutando initState() de nuevo."
    },
    {
      q: "¿Qué debe contener el argumento (callback) de setState()?",
      options: ["Cualquier código, incluyendo peticiones de red asíncronas", "Únicamente la actualización síncrona de las variables de estado", "Solo instrucciones print()", "La llamada a build()"],
      correct: 1,
      explain: "El callback de setState() debe ser síncrono y contener solo la actualización de variables de estado; build() lo llama Flutter por su cuenta."
    }
  ];

  var quizOrder = [];
  var quizIdx = 0;
  var quizScore = 0;
  var answered = false;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startQuiz() {
    quizOrder = shuffle(quizBank.map(function (_, i) { return i; }));
    quizIdx = 0;
    quizScore = 0;
    renderQuiz();
  }

  function renderQuiz() {
    var card = document.getElementById("quizCard");
    var progress = document.getElementById("quizProgress");

    if (quizIdx >= quizOrder.length) {
      progress.textContent = "Completado";
      card.innerHTML =
        '<div class="quiz-done"><div class="score">' + quizScore + ' / ' + quizOrder.length + '</div>' +
        '<p style="color:var(--ink-soft);margin-top:8px;">respuestas correctas</p>' +
        '<div class="quiz-nav" style="justify-content:center;margin-top:24px;"><button id="restartBtn">Reintentar con otro orden</button></div></div>';
      document.getElementById("restartBtn").addEventListener("click", startQuiz);
      return;
    }

    progress.textContent = "Pregunta " + (quizIdx + 1) + " / " + quizOrder.length;
    var item = quizBank[quizOrder[quizIdx]];
    answered = false;

    var html = '<p class="quiz-q">' + item.q + '</p><div class="quiz-opts">';
    item.options.forEach(function (opt, i) {
      html += '<button class="quiz-opt" data-i="' + i + '">' + opt + '</button>';
    });
    html += '</div><div class="quiz-explain" id="quizExplain"></div>';
    html += '<div class="quiz-nav"><span></span><button id="quizNext" disabled>Siguiente →</button></div>';
    card.innerHTML = html;

    var opts = card.querySelectorAll(".quiz-opt");
    opts.forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (answered) return;
        answered = true;
        var chosen = parseInt(btn.getAttribute("data-i"), 10);
        opts.forEach(function (b) {
          b.disabled = true;
          var bi = parseInt(b.getAttribute("data-i"), 10);
          if (bi === item.correct) b.classList.add("correct");
          else if (bi === chosen) b.classList.add("wrong");
        });
        if (chosen === item.correct) quizScore++;
        var ex = document.getElementById("quizExplain");
        ex.innerHTML = item.explain;
        ex.classList.add("show");
        document.getElementById("quizNext").disabled = false;
      });
    });

    document.getElementById("quizNext").addEventListener("click", function () {
      quizIdx++;
      renderQuiz();
    });
  }

  document.getElementById("quizShuffle").addEventListener("click", startQuiz);
  startQuiz();

  // ---------------- TABS ----------------
  var tabDiagram = document.getElementById("tab-diagram");
  var tabQuiz = document.getElementById("tab-quiz");
  var viewDiagram = document.getElementById("view-diagram");
  var viewQuiz = document.getElementById("view-quiz");

  function showDiagram() {
    tabDiagram.classList.add("active"); tabDiagram.setAttribute("aria-selected", "true");
    tabQuiz.classList.remove("active"); tabQuiz.setAttribute("aria-selected", "false");
    viewDiagram.classList.add("active"); viewQuiz.classList.remove("active");
  }
  function showQuiz() {
    tabQuiz.classList.add("active"); tabQuiz.setAttribute("aria-selected", "true");
    tabDiagram.classList.remove("active"); tabDiagram.setAttribute("aria-selected", "false");
    viewQuiz.classList.add("active"); viewDiagram.classList.remove("active");
  }
  tabDiagram.addEventListener("click", showDiagram);
  tabQuiz.addEventListener("click", showQuiz);
})();
</script>

</body></html>
